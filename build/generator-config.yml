provider:
  name: hyperstack
  #schema_ref: '#/components/schemas/hyperstack_provider_schema'

data_sources:
  core_dashboard:
    read:
      path: /core/dashboard
      method: GET

  core_stocks:
    read:
      path: /core/stocks
      method: GET
    schema:
      ignores:
        - stocks.models.configurations

  core_firewall_protocols:
    read:
      path: /core/sg-rules-protocols
      method: GET

  core_flavors:
    read:
      path: /core/flavors
      method: GET

  core_images:
    read:
      path: /core/images
      method: GET
    schema:
      ignores:
        - images

  core_regions:
    read:
      path: /core/regions
      method: GET

  core_gpus:
    read:
      path: /core/gpus
      method: GET

  core_environment:
    read:
      path: /core/environments/{id}
      method: GET

  core_environments:
    read:
      path: /core/environments
      method: GET
    schema:
      ignores:
        - page_size

  core_volumes:
    read:
      path: /core/volumes
      method: GET
    schema:
      ignores:
        - page_size

  core_volume_types:
    read:
      path: /core/volume-types
      method: GET

  auth_me:
    read:
      path: /auth/me
      method: GET

  auth_user_permissions:
    read:
      path: /auth/users/{id}/permissions
      method: GET

  auth_user_me_permissions:
    read:
      path: /auth/users/me/permissions
      method: GET

  auth_organization:
    read:
      path: /auth/organizations
      method: GET

  auth_roles:
    read:
      path: /auth/roles
      method: GET
    schema:
      ignores:
        - permissions
        - policies

  auth_role:
    read:
      path: /auth/roles/{id}
      method: GET

  auth_policies:
    read:
      path: /auth/policies
      method: GET

  auth_permissions:
    read:
      path: /auth/permissions
      method: GET

  core_keypair:
    read:
      path: /core/keypairs
      method: GET
    schema:
      ignores:
        - page_size
        - environment
        - features

  core_keypairs:
    read:
      path: /core/keypairs
      method: GET
    schema:
      ignores:
        - page_size

  core_virtual_machines:
    read:
      path: /core/virtual-machines
      method: GET
    schema:
      ignores:
        - page_size
        - features
        - flavor
        - flavor.features

  core_clusters:
    read:
      path: /core/clusters
      method: GET
    schema:
      ignores:
        - labels
        - features
        - master_flavor.features
        - master_flavor.labels
        - worker_flavor.features
        - worker_flavor.labels

  core_clusters_versions:
    read:
      path: /core/clusters/versions
      method: GET

  core_cluster_node_groups:
    read:
      path: /core/clusters/{cluster_id}/node-groups
      method: GET

  core_cluster_node_group:
    read:
      path: /core/clusters/{cluster_id}/node-groups/{node_group_id}
      method: GET

  core_cluster_nodes:
    read:
      path: /core/clusters/{cluster_id}/nodes
      method: GET

resources:
  core_virtual_machine_sg_rule:
    read:
      path: /core/virtual-machines/{vm_id}/sg-rules
      method: GET
    create:
      path: /core/virtual-machines/{vm_id}/sg-rules
      method: POST
    delete:
      path: /core/virtual-machines/{vm_id}/sg-rules/{sg_rule_id}
      method: DELETE

  core_environment:
    read:
      path: /core/environments/{id}
      method: GET
    create:
      path: /core/environments
      method: POST

  auth_role:
    read:
      path: /auth/roles/{id}
      method: GET
    create:
      path: /auth/roles
      method: POST
    schema:
      ignores:
        - permissions
        - policies

  core_keypair:
    read:
      path: /core/keypairs
      method: GET
    create:
      path: /core/keypairs
      method: POST
    update:
      path: /core/keypair/{id}
      method: PUT
    schema:
      ignores:
        - page_size
        - environment
        - features

  core_virtual_machine:
    read:
      path: /core/virtual-machines/{vm_id}
      method: GET
    create:
      path: /core/virtual-machines
      method: POST
    schema:
      ignores:
        - features
        - flavor
        - flavor.features

  core_volume:
    read:
      path: /core/volumes/{volume_id}
      method: GET
    create:
      path: /core/volumes
      method: POST

  core_cluster:
    read:
      path: /core/clusters/{id}
      method: GET
    create:
      path: /core/clusters
      method: POST

  core_cluster_node_group:
    read:
      path: /core/clusters/{cluster_id}/node-groups/{node_group_id}
      method: GET
    create:
      path: /core/clusters/{cluster_id}/node-groups
      method: POST
    update:
      path: /core/clusters/{cluster_id}/node-groups/{node_group_id}
      method: PATCH
    delete:
      path: /core/clusters/{cluster_id}/node-groups/{node_group_id}
      method: DELETE

  core_cluster_node:
    read:
      path: /core/clusters/{cluster_id}/nodes/{node_id}
      method: GET
    create:
      path: /core/clusters/{cluster_id}/nodes
      method: POST
    delete:
      path: /core/clusters/{cluster_id}/nodes/{node_id}
      method: DELETE
    schema:
      ignores:
        - labels
        - features
        - master_flavor.features
        - master_flavor.labels
        - worker_flavor.features
        - worker_flavor.labels
